name: CI/CD Pipeline for AutoParts
# Triggers: Se activa en push a develop y en PRs a main
on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ main ]
jobs:
  build-and-test:
    runs-on: ubuntu-latest # Entorno Linux para Docker
    steps:
    - name: Checkout code
      uses: actions/checkout@v4 # Clona el repo
      with:
        fetch-depth: 0 # Para SonarCloud (necesita commits históricos)
    # SonarCloud steps (mantén igual)
    - name: SonarCloud Begin
      if: github.event_name == 'pull_request' && github.base_ref == 'main'
      uses: sonarsource/sonarqube-scan-action@master
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: https://sonarcloud.io
    - name: SonarCloud Execute
      if: github.event_name == 'pull_request' && github.base_ref == 'main'
      uses: sonarsource/sonarqube-scan-action@master
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: https://sonarcloud.io
        SONAR_PROJECT_KEY: AUY102-Pipeline # Tu Project Key
        SONAR_PROJECT_BRANCH: ${{ github.head_ref }}
    - name: SonarCloud Quality Gate
      if: github.event_name == 'pull_request' && github.base_ref == 'main'
      run: |
        sleep 30
        RESPONSE=$(curl -s -u ${{ secrets.SONAR_TOKEN }}: https://sonarcloud.io/api/qualitygates/project_status?projectKey=AUY102-Pipeline)
        STATUS=$(echo $RESPONSE | sed 's/.*"status":"\([^"]*\)".*/\1/')
        if [ "$STATUS" != "OK" ]; then
          echo "Quality Gate failed: $STATUS"
          exit 1
        fi
        echo "Quality Gate passed: $STATUS"
      continue-on-error: false
    # Snyk steps (mantén igual)
    - name: Install Snyk
      if: github.event_name == 'pull_request' && github.base_ref == 'main'
      run: npm install -g snyk
    - name: Snyk Test
      if: github.event_name == 'pull_request' && github.base_ref == 'main'
      run: |
        snyk auth ${{ secrets.SNYK_TOKEN }}
        snyk test --severity-threshold=high --file=requirements.txt
      continue-on-error: false
    # Para GH Advanced Security (escaneo de código y secrets)
    - name: Initialize CodeQL
      if: github.event_name == 'pull_request' && github.base_ref == 'main'
      uses: github/codeql-action/init@v3
      with:
        languages: python # Para Django/Python
    - name: Perform CodeQL Analysis
      if: github.event_name == 'pull_request' && github.base_ref == 'main'
      uses: github/codeql-action/analyze@v3
      # Falla si vulns críticas (configura en Settings > Code security)
    # NUEVO GHAS: Dependency review (análisis de deps)
    - name: Dependency Review
      if: github.event_name == 'pull_request' && github.base_ref == 'main'
      uses: actions/dependency-review-action@v4
      # Falla si vulns en deps (usa SBOM de GitHub)
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Build Docker image
      id: build
      run: |
        docker build -t autoparts-app:${{ github.sha }} .
    - name: Run unit tests inside container
      run: |
        docker run --rm autoparts-app:${{ github.sha }} /bin/bash -c "cd backend && python manage.py test"
    - name: Login to Docker Hub
      if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    - name: Push Docker image to Docker Hub
      if: success() && github.event_name == 'push' && github.ref == 'refs/heads/develop'
      run: |
        docker tag autoparts-app:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/autoparts-app:latest
        docker tag autoparts-app:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/autoparts-app:${{ github.sha }}
        docker push ${{ secrets.DOCKER_USERNAME }}/autoparts-app:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/autoparts-app:${{ github.sha }}
