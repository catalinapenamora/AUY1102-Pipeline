name: CI/CD Pipeline for AutoParts
# Triggers: Se activa en push a develop y en PRs a main
on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ main ]
jobs:
  build-and-test:
    runs-on: ubuntu-latest 
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Para SonarCloud (necesita commits históricos)
    # SonarCloud - Solo en PRs a main
    - name: SonarCloud Begin
      if: github.event_name == 'pull_request' && github.base_ref == 'main'
      uses: sonarsource/sonarqube-scan-action@master
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: https://sonarcloud.io
    - name: SonarCloud Execute
      if: github.event_name == 'pull_request' && github.base_ref == 'main'
      uses: sonarsource/sonarqube-scan-action@master
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: https://sonarcloud.io
        SONAR_PROJECT_KEY: AUY102-Pipeline
        SONAR_PROJECT_BRANCH: ${{ github.head_ref }} # Para branches en PR
    - name: SonarCloud Quality Gate
      if: github.event_name == 'pull_request' && github.base_ref == 'main'
      run: |
        # Espera y chequea si el Quality Gate pasa (falla job si no)
        sleep 30 # Espera que Sonar procese (ajusta si tarda más)
        # Usa curl para chequear status; falla si != "OK"
        RESPONSE=$(curl -s -u ${{ secrets.SONAR_TOKEN }}: https://sonarcloud.io/api/qualitygates/project_status?projectKey=AUY102-Pipeline)
        STATUS=$(echo $RESPONSE | sed 's/.*"status":"\([^"]*\)".*/\1/')
        if [ "$STATUS" != "OK" ]; then
          echo "Quality Gate failed: $STATUS"
          exit 1
        fi
        echo "Quality Gate passed: $STATUS"
      continue-on-error: false
    # Snyk - Solo en PRs a main
    - name: Install Snyk
      if: github.event_name == 'pull_request' && github.base_ref == 'main'
      run: npm install -g snyk
    - name: Snyk Test
      if: github.event_name == 'pull_request' && github.base_ref == 'main'
      run: |
        snyk auth ${{ secrets.SNYK_TOKEN }} # Autentica
        snyk test --severity-threshold=high --file=requirements.txt # Escanea requirements.txt
      continue-on-error: false #
    # GitHub Advanced Security - Solo en PRs a main
    - name: Initialize CodeQL
      if: github.event_name == 'pull_request' && github.base_ref == 'main'
      uses: github/codeql-action/init@v3
      with:
        languages: python
    - name: Perform CodeQL Analysis
      if: github.event_name == 'pull_request' && github.base_ref == 'main'
      uses: github/codeql-action/analyze@v3
      continue-on-error: false
    - name: Dependency Review
      if: github.event_name == 'pull_request' && github.base_ref == 'main'
      uses: actions/dependency-review-action@v4
      continue-on-error: false
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Build Docker image
      id: build
      run: |
        docker build -t autoparts-app:${{ github.sha }} . # Usa el commit SHA como tag
    # Docker Scout - Solo en PRs a main
    - name: Docker Scout
      if: github.event_name == 'pull_request' && github.base_ref == 'main'
      uses: docker/scout-action@v1
      with:
        image-ref: autoparts-app:${{ github.sha }}
        only-critical: true 
      continue-on-error: false
    - name: Run unit tests inside container
      run: |
        # Ejecuta pruebas dentro del contenedor (ajusta según tu app)
        docker run --rm autoparts-app:${{ github.sha }} /bin/bash -c "cd backend && python manage.py test"
        # Si las pruebas requieren migraciones o DB: agrega comandos como
        # docker run ... python manage.py migrate
        # docker run ... python manage.py test --settings=tu_settings_test
    - name: Login to Docker Hub
      if: github.event_name == 'push' && github.ref == 'refs/heads/develop' # Solo en push a develop
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    - name: Push Docker image to Docker Hub
      if: success() && github.event_name == 'push' && github.ref == 'refs/heads/develop' # Solo si tests pasan y en develop
      run: |
        docker tag autoparts-app:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/autoparts-app:latest
        docker tag autoparts-app:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/autoparts-app:${{ github.sha }}
        docker push ${{ secrets.DOCKER_USERNAME }}/autoparts-app:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/autoparts-app:${{ github.sha }}
      # Nota: En PRs a main, no pushea; solo build y test. Para deploy real, agregarías un job separado.
